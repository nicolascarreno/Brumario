services:
  # Aplicación completa (Backend + Frontend)
  - type: web
    name: brumario-dev
    env: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        value: ${MONGODB_URI}
      - key: PORT
        value: 10000
    healthCheckPath: /api/hello