services:
  # Backend service
  - type: web
    name: brumario-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        value: mongodb+srv://brumario-user:TU_PASSWORD@cluster0.xxxxx.mongodb.net/brumario?retryWrites=true&w=majority
    healthCheckPath: /hello

  # Frontend service
  - type: web
    name: brumario-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: brumario-backend
          property: host
